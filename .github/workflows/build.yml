name: Build PS4 Store

on:
  push:
    branches: [ master, main, 'copilot/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make

    - name: Setup OpenOrbis Toolchain
      run: |
        curl -sL https://github.com/LightningMods/OpenOrbis-PS4-Toolchain/releases/download/v0.50001/OOSDK.tar.gz \
          | tar -xz -C "$GITHUB_WORKSPACE"
        chmod +x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/"*
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    - name: Build Store
      run: |
        cd Store
        make -j$(nproc)
        # PkgTool.Core names the output after content_id; rename for consistency
        pkg=$(ls *.pkg 2>/dev/null | head -1)
        if [ -n "$pkg" ] && [ "$pkg" != "Store-R2.pkg" ]; then
          mv "$pkg" Store-R2.pkg
        fi
        test -f Store-R2.pkg || { echo "Error: Store-R2.pkg was not created"; exit 1; }
        test -f homebrew.elf || { echo "Error: homebrew.elf was not created"; exit 1; }
        # Regenerate remote.md5 so CDN operators can detect this build as an update
        # (Store-Loader compares the *contents* of remote.md5 vs local.md5 to decide
        # whether a new homebrew.elf needs to be downloaded).
        md5sum homebrew.elf | awk '{print $1}' > remote.md5

    - name: Determine store version
      id: version
      run: |
        major=$(grep -oP '#define\s+VERSION_MAJOR\s+\K[0-9]+' Store/include/defines.h)
        minor=$(grep -oP '#define\s+VERSION_MINOR\s+\K[0-9]+' Store/include/defines.h)
        test -n "$major" || { echo "Error: could not determine VERSION_MAJOR"; exit 1; }
        test -n "$minor" || { echo "Error: could not determine VERSION_MINOR"; exit 1; }
        echo "tag=${major}.${minor}" >> "$GITHUB_OUTPUT"

    - name: Upload PKG artifact
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Store-PKG
        path: |
          Store/Store-R2.pkg
          Store/homebrew.elf
          Store/remote.md5

    - name: Publish release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        # Tagged numerically (x.y) so the CDN server can compare this value
        # against the currently deployed Store binary to decide whether an
        # update is needed.
        tag_name: ${{ steps.version.outputs.tag }}
        name: Store ${{ steps.version.outputs.tag }}
        prerelease: false
        files: |
          Store/Store-R2.pkg
          Store/homebrew.elf
          Store/remote.md5
